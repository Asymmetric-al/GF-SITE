name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Unit Tests, Build & Smoke Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run Ultracite lint and format checks
        run: bun run check

      - name: Verify foundation invariants (zero Radix, skill parity, manifest)
        run: bun run check:foundation

      - name: Validate OKF v0.3 knowledge bundle
        run: bun run okf:validate

      - name: Check unused files, exports, and dependencies (Knip)
        run: bun run knip

      - name: Check offline Markdown documentation links (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --config lychee.toml README.md AGENTS.md CLAUDE.md DESIGN.md specs/README.md docs/**/*.md knowledge/**/*.md brand-kit/**/*.md
          fail: true

      - name: Scan repository for leaked secrets (Gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir --redact .

      - name: Run Vitest unit and component tests
        run: bun run test:run

      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build production bundle (includes route typegen and full TypeScript check)
        run: bun run build

      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx --no-install playwright install --with-deps chromium

      - name: Install Playwright Chromium OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx --no-install playwright install-deps chromium

      - name: Run Playwright Chromium smoke, SEO, and accessibility checks
        run: bun run test:smoke

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ci-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
